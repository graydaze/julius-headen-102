<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="18" fill="#06101F" />
  <rect x="4" y="4" width="92" height="92" rx="14" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="2" />
  <!-- Radiant lines behind the triangle -->
  <g stroke="#D4AF37" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round">
    <line x1="50" y1="8" x2="50" y2="14" />
    <line x1="25" y1="22" x2="29" y2="26" />
    <line x1="75" y1="22" x2="71" y2="26" />
  </g>
  <!-- Equilateral Triangle -->
  <polygon
    points="50,18 16,80 84,80"
    stroke="#D4AF37"
    stroke-width="5.5"
    stroke-linejoin="round"
  />
  <!-- All-Seeing Eye -->
  <path
    d="M 31 59 Q 50 41 69 59 Q 50 77 31 59 Z"
    stroke="#D4AF37"
    stroke-width="4.5"
    stroke-linejoin="round"
  />
  <circle cx="50" cy="59" r="7" stroke="#D4AF37" stroke-width="3" />
  <circle cx="50" cy="59" r="3" fill="#D4AF37" />
</svg>
